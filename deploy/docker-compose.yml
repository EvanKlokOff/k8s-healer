# docker-compose.yml
#
# K8s Node Healer — инфраструктура (только БД).
# healer-core и healer-scout-* запускаются НАТИВНО на Mac,
# потому что Docker Desktop не видит WireGuard-туннель (utun4),
# а скаутам и core нужен доступ к 192.168.122.0/24.
#
# Запуск:
#   cp .env.example .env && chmod 600 .env
#   docker compose up -d
#   ./scripts/run-core.sh          # в отдельном терминале
#   ./scripts/run-scout.sh k8s-worker-1   # в отдельном терминале
#   ./scripts/run-scout.sh k8s-master
#   ./scripts/run-scout.sh k8s-worker-2

name: k8s-node-healer

services:
  # ─────────────────────────────────────────────────────────────
  # Postgres — audit sink (healer/audit/postgres.py)
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: healer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healer}
      POSTGRES_USER: ${POSTGRES_USER:-healer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Core нативный на хосте → нужен доступ через 127.0.0.1
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healer} -d ${POSTGRES_DB:-healer}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [healer-net]

  # ─────────────────────────────────────────────────────────────
  # Redis — Deduplicator, RateLimitGuardrail, LLM cache
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: healer-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [healer-net]

volumes:
  pg_data:
  redis_data:

networks:
  healer-net:
    driver: bridge